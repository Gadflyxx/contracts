[package]
name = "remitpulse-account"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT"

[features]
# Build release WASM first; reruns the account suite against the Soroban VM.
wasm-tests = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

remitpulse-webauthn-verifier = { path = "../../crates/webauthn-verifier" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "3"
p256 = { version = "0.14", features = ["ecdsa"] }
