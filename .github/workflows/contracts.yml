name: RemitPulse contracts
on: [push, pull_request, workflow_dispatch]

# The workflow only reads source code and uploads build artifacts.
permissions:
  contents: read

# Keep only the newest run for a branch or pull request.
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32v1-none
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release --target wasm32v1-none
      - run: bash -n deploy.sh scripts/build.sh
      - run: python3 -m unittest discover -s tests -v
      - run: cargo test -p remitpulse-account --locked --features wasm-tests
      - name: Record WASM checksums
        run: sha256sum target/wasm32v1-none/release/remitpulse_*.wasm > target/wasm32v1-none/release/SHA256SUMS
      - name: Record WASM provenance
        run: |
          set -euo pipefail
          RUSTC_VERSION="$(rustc --version)"
          SHA256SUMS_HASH="$(sha256sum target/wasm32v1-none/release/SHA256SUMS | awk '{print $1}')"
          cat > target/wasm32v1-none/release/provenance.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "rustc_version": "${RUSTC_VERSION}",
            "target": "wasm32v1-none",
            "sha256sums_sha256": "${SHA256SUMS_HASH}"
          }
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: remitpulse-contracts-${{ github.sha }}
          path: |
            target/wasm32v1-none/release/remitpulse_*.wasm
            target/wasm32v1-none/release/SHA256SUMS
            target/wasm32v1-none/release/provenance.json
          if-no-files-found: error

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --no-deps keeps lint output scoped to repository code; -D warnings fails on any project warning.
      - run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # Any exclusions must be narrowly scoped inline `# shellcheck disable=` directives in the scripts.
      - name: Run ShellCheck
        run: shellcheck deploy.sh scripts/build.sh

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Scans Cargo.lock. Documented, time-bounded exceptions belong in .cargo/audit.toml (ignore list).
      - name: Run cargo audit
        run: cargo audit --file Cargo.lock